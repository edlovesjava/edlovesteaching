version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: consulting-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: consulting
      MYSQL_USER: consulting
      MYSQL_PASSWORD: consulting
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - consulting-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: consulting-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/consulting?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: consulting
      SPRING_DATASOURCE_PASSWORD: consulting
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - consulting-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: consulting-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - consulting-network

volumes:
  mysql_data:

networks:
  consulting-network:
    driver: bridge
