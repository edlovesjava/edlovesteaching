spring:
  application:
    name: consulting-platform
  
  datasource:
    url: jdbc:mysql://mysql:3306/consulting?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: consulting
    password: consulting
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.consulting.platform: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
